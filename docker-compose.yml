services:
  app:
    build: .
    container_name: doctor-appointment
    ports:
      - "8000:9000"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  mysql:
    image: mysql:5.7
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: doctor-appointment
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    ports:
      - "3306:3306"
    restart: unless-stopped
    volumes:
      - mysql-data: /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin","ping","-h","localhost","-u","root","-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
     - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    networks:
      - app-network
networks:
   app-network:
volumes:
  mysql-data:





